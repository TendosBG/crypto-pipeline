name: Crypto Pipeline

on:
  schedule:
    - cron: '0 * * * *'
  workflow_dispatch:

jobs:
  run-pipeline:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Create dbt profiles
        run: |
          mkdir -p ~/.dbt
          printf 'crypto_pipeline:\n  target: dev\n  outputs:\n    dev:\n      type: duckdb\n      path: md:crypto_pipeline\n' > ~/.dbt/profiles.yml

      - name: Run pipeline
        env:
          MOTHERDUCK_TOKEN: ${{ secrets.MOTHERDUCK_TOKEN }}
        run: python -m orchestration.pipeline
